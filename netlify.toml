# Deploy configuration lives in the repo, not the Netlify dashboard, so a fresh
# clone builds identically. This file takes precedence over the UI settings.

[build]
  # Netlify runs its dependency install against the manifest found in `base`.
  # Pointing base at the app (rather than the repo root) is what makes it run
  # `npm ci` for the frontend. `publish` resolves relative to `base`.
  base = "frontend_react"
  command = "npm run build"
  publish = "build"

[build.environment]
  # Kept in sync with .nvmrc. Vite 8 and sass 1.103 both require >=20.19.
  NODE_VERSION = "22"

[functions]
  # Resolved relative to `base`, i.e. frontend_react/netlify/functions.
  # Functions bundle their deps from frontend_react/node_modules, which is
  # where @sanity/client already lives.
  directory = "netlify/functions"
  node_bundler = "esbuild"
